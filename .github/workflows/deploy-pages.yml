# Publie le site généré (dossier docs/) sur GitHub Pages.
# L'environnement github-pages du dépôt n'accepte que la branche par défaut (claude/quirky-curie-ebilp7) :
# pousser le portfolio sur cette branche met le site à jour.
name: Publier le portfolio

on:
  push:
    branches: ["claude/quirky-curie-ebilp7"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Deux tâches, comme le modèle officiel de GitHub : le déploiement attend que l'artefact soit enregistré.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
