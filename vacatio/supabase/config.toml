# Configuration Supabase CLI (développement local : `supabase start`, nécessite Docker).
# En production, le projet est hébergé chez Supabase en région UE (Paris : eu-west-3).
project_id = "vacatio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 3600

[auth.sms]
# Les agents ne passent PAS par le fournisseur SMS de Supabase : Vacatio génère
# lui-même le lien magique et l'envoie via Brevo (voir src/lib/auth/agent-link.ts).
enable_signup = false

[auth.rate_limit]
email_sent = 30
token_verifications = 30
